pre-commit:
  commands:
    check:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}'
      run: bun run eslint {staged_files} --fix
      stage_fixed: true

pre-push:
  jobs:
    - run: bun run typecheck
    - run: bunx eslint .
    - run: bun run verify/index.ts --exit-on-fail
    - run: bun run build-storybook
