name: Deploy

# 非纯文档 push 自动部署；也可手动触发。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'test/**'
      - 'verify/**'
      - '.agents/**'
      - '.commandcode/**'
      - .github/workflows/verify.yml
      - .gitignore
      - lefthook.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check configuration
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Build and validate
        run: bun run deploy -- --no-deploy

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config build/server/wrangler.json

      - name: Smoke
        if: ${{ vars.HOSTNAME != '' }}
        env:
          # 不用 HOSTNAME：Linux runner 自带同名机器名变量
          SITE_URL: ${{ vars.HOSTNAME }}
        run: |
          for path in / /openapi.json /llms.txt; do
            curl -fsS "$SITE_URL$path" > /dev/null
          done
