name: Verification Suite

on:
  push:
    branches: [main]
    paths:
      - 'app/lib/**'
      - 'app/routes/**'
      - 'app/components/**'
      - 'verify/**'
      - 'test/**'
      - 'scripts/**'
      - .github/workflows/verify.yml
  pull_request:
    branches: [main]
    paths:
      - 'app/lib/**'
      - 'app/routes/**'
      - 'app/components/**'
      - 'verify/**'
      - 'test/**'
      - 'scripts/**'
      - .github/workflows/verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx eslint .

      - name: Unit tests
        run: bun run test

      - name: Verification suite
        run: bun run verify/index.ts --exit-on-fail
