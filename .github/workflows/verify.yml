name: Verification Suite

on:
  push:
    branches: [main]
    paths:
      - 'app/lib/**'
      - 'app/routes/**'
      - 'app/components/**'
      - 'verify/**'
      - 'test/**'
      - 'scripts/**'
      - package.json
      - bun.lock
      - vite.config.ts
      - react-router.config.ts
      - .github/workflows/verify.yml
  pull_request:
    branches: [main]
    paths:
      - 'app/lib/**'
      - 'app/routes/**'
      - 'app/components/**'
      - 'verify/**'
      - 'test/**'
      - 'scripts/**'
      - package.json
      - bun.lock
      - vite.config.ts
      - react-router.config.ts
      - .github/workflows/verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx eslint .

      - name: Production build
        # 构建门禁：拦截 .tsx 转换链/依赖升级导致的构建失败（postmortem 010）
        run: bun run build

      - name: Verification suite (unit + acceptance + integration)
        # verify 已包含 unit + acceptance（见 verify/index.ts scoping），
        # 不再单独跑 bun run test，避免同一套 node 测试在 CI 里重复执行
        run: bun run verify/index.ts --exit-on-fail
