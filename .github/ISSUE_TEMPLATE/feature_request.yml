name: Feature Request
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有类似提议。功能确认后再动手实现，避免白做。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你想解决什么问题，现在为什么不方便
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有考虑过其他做法，或者别的项目是怎么解决的
    validations:
      required: false
